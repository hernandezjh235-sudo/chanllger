name: Inspect PO History Schema

on:
  pull_request:
    paths:
      - 'tools/inspect_po_history_schema.py'
      - '.github/workflows/inspect_po_history_schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Inspect PO saved history
        run: python tools/inspect_po_history_schema.py
