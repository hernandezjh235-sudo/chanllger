name: Verify Savant Card V5

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install -q pandas numpy streamlit requests
      - name: Apply K authority first
        run: python tools/apply_savant_k_authority_patch.py --app app.py
      - name: Apply final-card Savant V5
        run: python tools/apply_savant_batter_display_patch_v5.py --app app.py
      - name: Runtime-test exact final-card function against current Savant data
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import pandas as pd
          text=Path('app.py').read_text(encoding='utf-8-sig')
          tree=ast.parse(text)
          nodes=[n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and n.name=='_v269_savant_shadow_rows' and n.col_offset==0]
          assert len(nodes)==1, len(nodes)
          n=nodes[0]
          src='\n'.join(text.splitlines()[n.lineno-1:n.end_lineno])
          class Service:
              def load(self):
                  return pd.read_csv('learning_data/savant_batter_platoon_2026.csv')
          ns={'_v269_savant_service':lambda:Service()}
          exec(src,ns)
          fn=ns['_v269_savant_shadow_rows']

          tests=[
            ('Angels',["Jose Siri","Mike Trout","Vaughn Grissom","Zach Neto","Moisés Ballesteros","Denzer Guzman","Josh Lowe","Tyler Heineman","Adam Frazier"],'R',21.4),
            ('Boston',["Nick Sogard","Ceddanne Rafaela","Wilyer Abreu","Willson Contreras","Adley Rutschman","Caleb Durbin","Jarren Duran","Andruw Monasterio","Mickey Gasper"],'L',9.7),
            ('Dodgers',["Shohei Ohtani","Freddie Freeman","Andy Pages","Max Muncy","Mookie Betts","Kyle Tucker","Tommy Edman","Teoscar Hernández","Hunter Feduccia"],'R',9.0),
          ]
          for label,lineup,hand,bf in tests:
              rows=[{'Batter':x,'Used K%':20.0} for x in lineup]
              out,audit=fn(rows,hand,bf,{})
              assert audit['matched']==9 and audit['status']=='FULL', (label,audit)
              for r in out:
                  pa=r.get('savant_raw_vs_hand_pa'); so=r.get('savant_raw_vs_hand_so'); kp=r.get('savant_raw_vs_hand_k_pct')
                  assert pa and pa>0 and so is not None and kp is not None, (label,r)
                  assert abs(kp-(100.0*so/pa)) < 0.01, (label,r)
                  assert r.get('model_minus_savant_pp') is not None, (label,r)
              print(label,audit)

          out,audit=fn([{'Batter':'Mike Trout','Used K%':27.0}],'R',4.0,{})
          trout=out[0]
          assert audit['matched']==1
          assert abs(trout['savant_raw_vs_hand_k_pct']-(100.0*trout['savant_raw_vs_hand_so']/trout['savant_raw_vs_hand_pa'])) < 0.01
          print('Mike Trout current',trout)
          print('FINAL CARD SAVANT V5 RUNTIME PASS')
          PY
      - name: Apply ML and PO layers exactly like Railway
        run: |
          python tools/apply_ml_weather_delay_patch.py --app app.py
          python tools/apply_ml_environment_v2_patch.py --app app.py
          python tools/apply_po_workload_v3_patch.py --app app.py
      - name: Compile full combined app
        run: python -m py_compile app.py
      - name: Confirm combined markers
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8-sig')
          for marker in [
            'CHALLENGER_SAVANT_K_AUTHORITY_V1_2026_08_23',
            'CHALLENGER_SAVANT_BATTER_DISPLAY_V5_2026_08_23',
            'CHALLENGER_ML_WEATHER_DELAY_V1_2026_08_23',
            'CHALLENGER_ML_ENVIRONMENT_V2_2026_08_23',
            'CHALLENGER_PO_WORKLOAD_V3_2026_08_23',
            'PO_WORKLOAD_V3_SHADOW_2026_08_23',
          ]:
              assert marker in t, marker
          print('COMBINED APP MARKERS PASS')
          PY
