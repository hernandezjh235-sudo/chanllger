name: Build Challenger V1.11

on:
  push:
    branches:
      - main
    paths:
      - 'challenger_bootstrap.py'
      - '.github/challenger_v101_to_v111.patch.gz.b64'
      - '.github/workflows/build_challenger_v111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Challenger
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pandas

      - name: Build and validate Challenger
        run: |
          python challenger_bootstrap.py
          python -m py_compile app.py merge_v269_safe_update.py
          grep -q 'UNDEFEATED_BETA_V1_11_FALSE_UNDER_GUARD_2026_08_19' app.py
          grep -q 'def _ub_v111_false_under_profile' app.py
          grep -q 'def _ub_v111_preserve_control_under_profile' app.py

      - name: Commit materialized Challenger app and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py merge_v269_safe_update.py CHALLENGER_BUILD_INFO.json \
                  learning_data/savant_full_pitcher_profiles.csv \
                  learning_data/graded_history.csv \
                  learning_data/Bullpen.csv \
                  learning_data/TeamOffense.csv
          if git diff --cached --quiet; then
            echo "Challenger materialization already current."
          else
            git commit -m "Materialize validated Challenger V1.11 app and data"
            git push origin HEAD:main
          fi

